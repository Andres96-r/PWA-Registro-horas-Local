  :root{
    /* Paleta PlanBoda: marfil, vino, rosa empolvado, dorado, salvia, terracota */
    --bg:#F5EEE3; --surface:#FFFFFF; --surface2:#F4ECDE; --line:#E7DAC7;
    --text:#3B2F2A; --muted:#8C7C6D; --faint:#B4A491;
    --accent:#7C2E3C; --accent-dim:#F1DED7;   /* vino / rosa empolvado */
    --gold:#B0872F; --info:#B0872F;            /* dorado (dinero) */
    --live:#7F9163; --danger:#C2573F;          /* salvia / terracota */
    --blush:#E7C9C1; --red:#C0392B; --red-bg:#F7E3DF; /* rojo alerta (tope) */
    --sat:env(safe-area-inset-top); --sab:env(safe-area-inset-bottom);
    --sal:env(safe-area-inset-left); --sar:env(safe-area-inset-right);
    --navh:64px;
    --display:'Cormorant',Georgia,'Times New Roman',serif;
    --num:'Jost',-apple-system,system-ui,sans-serif;
    --sans:'Jost',-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;
    --shadow:0 6px 20px rgba(90,60,40,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg); color:var(--text); font-family:var(--sans); font-size:16px; line-height:1.45;
    overscroll-behavior-y:none; -webkit-font-smoothing:antialiased;
    background-image:radial-gradient(120% 60% at 50% -10%, #FBF6EE 0%, var(--bg) 60%);
  }
  button{font-family:inherit;color:inherit;cursor:pointer}
  input,select,textarea{font-family:inherit;font-size:16px}
  .num{font-family:var(--num);font-variant-numeric:tabular-nums}

  #app{min-height:100%;display:flex;flex-direction:column;
    padding:calc(var(--sat) + 8px) var(--sar) calc(var(--navh) + var(--sab)) var(--sal);

<body>
<div id="app">

    <button class="rate-chip" id="rateChip">💵 <span id="rateChipVal">—</span> <small>/h</small></button>
  </header>
  <main id="view"></main>
</div>

<nav class="tabs" id="tabs">
  <button data-tab="fichar" aria-current="true"><span class="ic">⏱️</span>Fichar</button>
  <button data-tab="resumen"><span class="ic">📊</span>Resumen</button>
  <button data-tab="pagos"><span class="ic">💰</span>Pagos</button>
  <button data-tab="ajustes"><span class="ic">⚙️</span>Ajustes</button>

    <h3 id="confirmTitle">¿Estás seguro?</h3>
    <p id="confirmMsg"></p>

    </div>

  <div class="confirm-card" id="reviewCard"></div>

<script>
/* =========================================================================
   FICHAJE — PWA local-first. Autor: para Ale. Todo el estado vive en IndexedDB.
   Modelo de datos:
     session = { id, date:'YYYY-MM-DD', start:'HH:MM', end:'HH:MM'|null, note }
     payment = { id, date, amount, forMonth:'YYYY-MM', note }
     monthlyPlans['YYYY-MM'] = { scheduledHours, rate? }   // horario definido + tarifa opcional del mes
     monthStatus['YYYY-MM'] = 'pendiente' | 'cobrado'
     settings = { rate, currency, lastBackup }
   ========================================================================= */

/* ---------- almacenamiento IndexedDB (un solo registro con todo el estado) ---------- */
const DB_NAME='fichaje-db', STORE='kv', KEY='state';
function openDB(){return new Promise((res,rej)=>{const r=indexedDB.open(DB_NAME,1);
  r.onupgradeneeded=()=>r.result.createObjectStore(STORE);
  r.onsuccess=()=>res(r.result); r.onerror=()=>rej(r.error);});}
async function dbGet(){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE);const rq=t.objectStore(STORE).get(KEY);rq.onsuccess=()=>res(rq.result||null);rq.onerror=()=>rej(rq.error);});}
async function dbSet(v){const db=await openDB();return new Promise((res,rej)=>{const t=db.transaction(STORE,'readwrite');t.objectStore(STORE).put(v,KEY);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);});}

let S = null; // estado en memoria
function migrate(st){
  if(!st || !Array.isArray(st.sessions)) return st;
  st.sessions = st.sessions.map(s=>{
    if(s && typeof s.start==='string' && s.start.includes('T')) return s; // ya es nuevo modelo
    if(s && s.date){ // modelo viejo: fecha única + horas HH:MM, cruce inferido
      const sd=s.date, st0=(s.start||'00:00');
      let ed=sd, et=s.end||null;
      if(et && hm2min(et) < hm2min(st0)) ed=addDays(sd,1); // salida "menor" => día siguiente
      return { id:s.id||uid(), start:`${sd}T${st0}`, end:et?`${ed}T${et}`:null, note:s.note||'' };
    }
    return s;
  });
  return st;
}
const DEFAULT = { version:2, sessions:[], payments:[], monthlyPlans:{}, monthStatus:{},
  settings:{ rate:0, currency:'ARS', lastBackup:null, maxHours:16 } };

let saveT=null;
function save(now){ clearTimeout(saveT);
  if(now){ dbSet(S).catch(()=>toast('⚠️ No se pudo guardar')); return; }      // grabado inmediato (fichajes)
  saveT=setTimeout(()=>dbSet(S).catch(()=>toast('⚠️ No se pudo guardar')), 250);
}

/* ---------- helpers de fecha/hora ---------- */
const pad=n=>String(n).padStart(2,'0');
const todayISO=(d=new Date())=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const nowHM=(d=new Date())=>`${pad(d.getHours())}:${pad(d.getMinutes())}`;
const nowISO=(d=new Date())=>`${todayISO(d)}T${pad(d.getHours())}:${pad(d.getMinutes())}`; // 'YYYY-MM-DDTHH:MM' local
const monthKey=iso=>iso.slice(0,7);
function addDays(iso,n){const d=new Date(iso+'T00:00:00');d.setDate(d.getDate()+n);return todayISO(d);}
// Un fichaje = { start:'YYYY-MM-DDTHH:MM', end:'YYYY-MM-DDTHH:MM'|null }. Cada horario lleva SU fecha.
const sDate=s=>s.start?s.start.slice(0,10):'';         // fecha de entrada (día al que se imputa el turno)
const eDate=s=>s.end?s.end.slice(0,10):null;           // fecha de salida
const sTime=s=>s.start?s.start.slice(11,16):'';        // hora de entrada
const eTime=s=>s.end?s.end.slice(11,16):null;          // hora de salida
function dayDiff(s){ if(!s.end) return 0; return Math.round((new Date(eDate(s)+'T00:00:00')-new Date(sDate(s)+'T00:00:00'))/86400000); }
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
function hm2min(hm){const[a,b]=hm.split(':').map(Number);return a*60+b;}
function rawDurH(s){ // horas reales entre dos fecha-hora (soporta turnos que cruzan uno o más días)
  if(!s.start) return 0;
  const end = s.end || nowISO();
  const d = (new Date(end) - new Date(s.start)) / 3600000;
  return isFinite(d) && d>0 ? d : 0;
}
function durH(s){ return Math.min(rawDurH(s), maxHours()); } // horas CONTABILIZADAS (con tope)
function fmtHM(h){const m=Math.round(h*60);return `${Math.floor(m/60)}:${pad(m%60)}`;}
const nf=new Intl.NumberFormat('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
const fmtDec=h=>nf.format(h);
function money(n){return new Intl.NumberFormat('es-AR',{style:'currency',currency:S.settings.currency||'ARS',maximumFractionDigits:0}).format(n||0);}
const MES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];
const DIA=['domingo','lunes','martes','miércoles','jueves','viernes','sábado'];
function labelMonth(mk){const[y,m]=mk.split('-');return `${MES[+m-1]} ${y}`;}
function daysInMonth(mk){const[y,m]=mk.split('-').map(Number);return new Date(y,m,0).getDate();}
function rateFor(mk){const p=S.monthlyPlans[mk];return (p&&p.rate!=null&&p.rate!=='')?+p.rate:(+S.settings.rate||0);}
function maxHours(){return +S.settings.maxHours||16;}
function isOverCap(s){return !!s.start && rawDurH(s) > maxHours()+1e-6;}
function fmtDateLong(iso){const d=new Date(iso+'T00:00:00');return `${DIA[d.getDay()]} ${pad(d.getDate())}/${pad(d.getMonth()+1)}`;}

/* ---------- agregaciones ---------- */
function openSession(){return S.sessions.find(s=>!s.end);}
function sessionsIn(pred){return S.sessions.filter(pred).sort((a,b)=>a.start.localeCompare(b.start));}
function hoursSum(list){return list.reduce((a,s)=>a+durH(s),0);}
function mondayOf(iso){const d=new Date(iso+'T00:00:00');const dow=(d.getDay()+6)%7;d.setDate(d.getDate()-dow);return todayISO(d);}
function weekRange(iso){const mon=mondayOf(iso);const d=new Date(mon+'T00:00:00');d.setDate(d.getDate()+6);return[mon,todayISO(d)];}

/* =========================================================================
   RENDER
   ========================================================================= */
let TAB='fichar';
let dashScope='mes';           // dia | semana | mes
let dashMonth=monthKey(todayISO());
let pagosMonth=monthKey(todayISO());
const $=id=>document.getElementById(id);

function render(){
  $('rateChipVal').textContent = (+S.settings.rate)? money(S.settings.rate).replace(/\s/g,' ') : 'Definir';
  document.querySelectorAll('#tabs button').forEach(b=>b.setAttribute('aria-current', b.dataset.tab===TAB));
  const v=$('view');
  if(TAB==='fichar') v.innerHTML=viewFichar();
  else if(TAB==='resumen') v.innerHTML=viewResumen();
  else if(TAB==='pagos') v.innerHTML=viewPagos();
  else v.innerHTML=viewAjustes();
  wire();
}

/* ---------- TAB FICHAR ---------- */
function viewFichar(){
  const now=new Date();
  const op=openSession();
  const today=todayISO();
  let todays=sessionsIn(s=>sDate(s)===today);
  const opX=openSession(); if(opX && sDate(opX)!==today && !todays.includes(opX)) todays=[opX,...todays]; // turno abierto de ayer
  const totalToday=hoursSum(todays);
  let punch;
  if(op){
    punch=`<button class="punch live" id="btnPunch">
      <span class="ring"></span>
      <span class="lbl">Fichando</span>
      <span class="big" id="liveTimer">0:00</span>
      <span class="sub">desde las ${op.start} · tocá para salir</span>
    </button>`;
  }else{
    punch=`<button class="punch" id="btnPunch">
      <span class="ring"></span>
      <span class="lbl">Fuera</span>
      <span class="big">Fichar</span>
      <span class="sub">tocá para marcar entrada</span>
    </button>`;
  }
  const list = todays.length? todays.map(sesItem).join('') :
    `<div class="empty">Todavía no fichaste hoy.</div>`;
  return `
    <div class="clock">
      <div class="day">${DIA[now.getDay()]} ${now.getDate()} de ${MES[now.getMonth()]}</div>
      <div class="time" id="wallClock">${nowHM(now)}</div>
    </div>
    <div class="punch-wrap">${punch}</div>
    <div class="row-actions">
      <button class="btn ghost" id="btnManual">＋ Cargar a mano</button>
    </div>
    <div class="sec-title">Hoy · ${fmtHM(totalToday)} hs</div>
    <div class="list">${list}</div>
  `;
}
function sesItem(s){
  const open=!s.end, over=isOverCap(s), cross = !!s.end && sDate(s)!==eDate(s);
  const hrs = open ? (over?fmtHM(durH(s))+' máx':'en curso') : fmtHM(durH(s));
  const times = `${sTime(s)} <span style="color:var(--faint)">→</span> ${eTime(s)||'···'}`
    + (cross?` <span class="flag daynext">+${dayDiff(s)}d</span>`:'')
    + (over?` <span class="flag">⚠︎ tope ${maxHours()} h</span>`:'');
  const sub = s.note ? `<div class="n">${escapeHTML(s.note)}</div>`
    : cross ? `<div class="d" style="text-transform:capitalize">${fmtDateLong(sDate(s))} → ${fmtDateLong(eDate(s))}</div>`
    : `<div class="d">${fmtDate(sDate(s))}</div>`;
  return `<div class="item ${open?'open':''} ${over?'over':''}" data-edit="${s.id}">
    <div class="meta"><div class="t">${times}</div>${sub}</div>
    <div class="h">${hrs}</div>
  </div>`;
}

/* ---------- TAB RESUMEN ---------- */
function viewResumen(){
  const seg=`<div class="segmented" id="seg">
    ${['dia','semana','mes'].map(k=>`<button data-scope="${k}" aria-current="${dashScope===k}">${k==='dia'?'Día':k==='semana'?'Semana':'Mes'}</button>`).join('')}
  </div>`;
  if(dashScope==='mes') return seg+resMes();
  if(dashScope==='semana') return seg+resSemana();
  return seg+resDia();
}
function resDia(){
  const iso=todayISO();
  const list=sessionsIn(s=>sDate(s)===iso);
  const h=hoursSum(list), r=rateFor(monthKey(iso));
  return `
    <div class="grid2">
      <div class="stat hl"><div class="k">Horas hoy</div><div class="v">${fmtHM(h)}</div><div class="x">${fmtDec(h)} h</div></div>
      <div class="stat money"><div class="k">A cobrar</div><div class="v sm">${money(h*r)}</div><div class="x">${r?money(r)+'/h':'sin tarifa'}</div></div>
    </div>
    <div class="sec-title">Fichajes de hoy</div>
    <div class="list">${list.length?list.map(sesItem).join(''):'<div class="empty">Sin fichajes.</div>'}</div>`;
}
function resSemana(){
  const [a,b]=weekRange(todayISO());
  const list=sessionsIn(s=>sDate(s)>=a&&sDate(s)<=b);
  const h=hoursSum(list), r=rateFor(monthKey(todayISO()));
  // por día
  const byDay={};
  list.forEach(s=>{const d=sDate(s);byDay[d]=(byDay[d]||0)+durH(s);});
  const days=[]; for(let i=0;i<7;i++){const d=new Date(a+'T00:00:00');d.setDate(d.getDate()+i);const iso=todayISO(d);days.push([iso,byDay[iso]||0]);}
  const max=Math.max(1,...days.map(d=>d[1]));
  const rows=days.map(([iso,hh])=>`
    <div class="item"><div class="meta"><div class="d" style="text-transform:capitalize">${DIA[new Date(iso+'T00:00:00').getDay()].slice(0,3)} ${iso.slice(8)}</div>
    <div class="bar" style="margin-top:7px"><i style="width:${Math.round(hh/max*100)}%"></i></div></div>
    <div class="h">${hh?fmtHM(hh):'—'}</div></div>`).join('');
  return `
    <div class="grid2">
      <div class="stat hl"><div class="k">Horas semana</div><div class="v">${fmtHM(h)}</div><div class="x">${fmtDate(a)} → ${fmtDate(b)}</div></div>
      <div class="stat money"><div class="k">A cobrar</div><div class="v sm">${money(h*r)}</div></div>
    </div>
    <div class="sec-title">Por día</div>
    <div class="list">${rows}</div>`;
}
function resMes(){
  const mk=dashMonth;
  const list=sessionsIn(s=>monthKey(sDate(s))===mk);
  const worked=hoursSum(list);
  const r=rateFor(mk);
  const plan=S.monthlyPlans[mk]||{};
  const sched=+plan.scheduledHours||0;
  // proyección lineal según avance del mes (solo si es el mes en curso)
  const nowMk=monthKey(todayISO());
  const dim=daysInMonth(mk);
  const dayNo = mk===nowMk ? new Date().getDate() : dim;
  const projected = mk>nowMk ? 0 : (mk===nowMk ? worked*dim/Math.max(1,dayNo) : worked);
  const status=S.monthStatus[mk]||'pendiente';
  const cobrado=S.payments.filter(p=>p.forMonth===mk).reduce((a,p)=>a+ (+p.amount||0),0);

  const pct = sched? Math.min(100,Math.round(worked/sched*100)) : 0;
  const nav=`<div class="navmonth">
    <button data-mm="-1">‹</button><div class="m">${labelMonth(mk)}</div><button data-mm="1">›</button></div>`;

  return nav+`
    <div class="grid2">
      <div class="stat hl"><div class="k">Trabajadas</div><div class="v">${fmtHM(worked)}</div><div class="x">${fmtDec(worked)} h${sched?` de ${fmtDec(sched)}`:''}</div>
        ${sched?`<div class="bar"><i style="width:${pct}%"></i></div>`:''}</div>
      <div class="stat"><div class="k">Previstas (definidas)</div><div class="v sm">${sched?fmtHM(sched):'—'}</div>
        <div class="x">${sched?`faltan ${fmtDec(Math.max(0,sched-worked))} h`:'sin definir'}</div></div>

      <div class="stat money"><div class="k">Ganado (real)</div><div class="v">${money(worked*r)}</div><div class="x">${r?money(r)+'/h':'sin tarifa'}</div></div>
      <div class="stat"><div class="k">Estimado fin de mes</div><div class="v sm">${mk<nowMk?money(worked*r):money(projected*r)}</div>
        <div class="x">${mk===nowMk?`proy. lineal · ${fmtDec(projected)} h`:mk>nowMk?'mes futuro':'mes cerrado'}</div></div>

      <div class="stat wide ${status==='cobrado'?'good':''}">
        <div class="k">Cobro del mes</div>
        <div class="v sm">${money(cobrado)} <span style="font-size:13px;color:var(--muted)">cobrado</span></div>
        <div class="x">${status==='cobrado'?'✓ Marcado como cobrado':`pendiente · diferencia ${money(worked*r-cobrado)}`}</div>
      </div>
    </div>
    <div class="row-actions">
      <button class="btn sm ghost" id="btnPlan" style="flex:1">🗓️ Definir horario del mes</button>
      <button class="btn sm ghost" id="btnRate2" style="flex:1">💵 Tarifa del mes</button>
    </div>`;
}

   INTERACCIONES
   ========================================================================= */
function wire(){
  // punch
  const bp=$('btnPunch'); if(bp) bp.onclick=doPunch;
  const bm=$('btnManual'); if(bm) bm.onclick=()=>editSession(null);
  document.querySelectorAll('[data-edit]').forEach(el=>el.onclick=()=>editSession(el.dataset.edit));

  // resumen
  const seg=$('seg'); if(seg) seg.querySelectorAll('button').forEach(b=>b.onclick=()=>{dashScope=b.dataset.scope;render();});
  document.querySelectorAll('[data-mm]').forEach(b=>b.onclick=()=>{dashMonth=shiftMonth(dashMonth,+b.dataset.mm);render();});
  if($('btnPlan')) $('btnPlan').onclick=editPlan;
  if($('btnRate2')) $('btnRate2').onclick=()=>editRate(dashMonth);

  // pagos
  document.querySelectorAll('[data-pm]').forEach(b=>b.onclick=()=>{pagosMonth=shiftMonth(pagosMonth,+b.dataset.pm);render();});
  if($('btnAddPay')) $('btnAddPay').onclick=()=>editPayment(null);
  document.querySelectorAll('[data-pay]').forEach(el=>el.onclick=()=>editPayment(el.dataset.pay));
  if($('btnMark')) $('btnMark').onclick=()=>{const s=S.monthStatus[pagosMonth]==='cobrado'?'pendiente':'cobrado';S.monthStatus[pagosMonth]=s;save();toast(s==='cobrado'?'Mes marcado como cobrado ✓':'Marcado pendiente');render();};

  // ajustes
  if($('rateChip')) $('rateChip').onclick=()=>editRate(null);
  if($('cfgRate')) $('cfgRate').onclick=()=>editRate(null);
  if($('cfgMax')) $('cfgMax').onclick=editMax;
  if($('expCSV')) $('expCSV').onclick=exportCSV;
  if($('expXLSX')) $('expXLSX').onclick=exportXLSX;
  if($('backup')) $('backup').onclick=backup;
  if($('restore')) $('restore').onclick=()=>$('fileInput').click();
  if($('fileInput')) $('fileInput').onchange=restore;
  if($('storageNote')) showStorage();
}
$('rateChip').onclick=()=>editRate(null);

function doPunch(){
  const op=openSession();
  if(op){
    const t=nowISO(); op.end=t; save(true);   // grabado inmediato (fecha+hora)
    render();
    showSalidaReview(op);                     // pedir confirmación mostrando los datos
  } else {
    const t=nowISO();
    S.sessions.push({id:uid(),start:t,end:null,note:''});
    save(true);                               // grabado inmediato: recuerda la entrada aunque apagues el cel
    toast('Entrada fichada · '+t.slice(11,16));
    render();
  }
}
function shiftMonth(mk,delta){let[y,m]=mk.split('-').map(Number);m+=delta;while(m<1){m+=12;y--;}while(m>12){m-=12;y++;}return `${y}-${pad(m)}`;}

/* ---------- sheets ---------- */
function openSheet(html){$('sheetBody').innerHTML=html;$('scrim').classList.add('on');$('sheet').classList.add('on');}
function closeSheet(){$('scrim').classList.remove('on');$('sheet').classList.remove('on');}
$('scrim').onclick=closeSheet;

/* ---------- cartel de confirmación propio (reemplaza confirm() nativo) ---------- */
let _confirmCb=null;
function askConfirm(opts, cb){
  const o=Object.assign({title:'¿Estás seguro?',msg:'',okText:'Eliminar',danger:true},opts);
  $('confirmTitle').textContent=o.title;
  $('confirmMsg').textContent=o.msg;
  const yes=$('confirmYes'); yes.textContent=o.okText; yes.className='btn '+(o.danger?'danger':'accent');
  _confirmCb=cb; $('cscrim').classList.add('on'); $('confirm').classList.add('on');
}
function closeConfirm(){ $('cscrim').classList.remove('on'); $('confirm').classList.remove('on'); _confirmCb=null; }
$('confirmNo').onclick=closeConfirm;
$('cscrim').onclick=closeConfirm;
$('confirmYes').onclick=()=>{ const cb=_confirmCb; closeConfirm(); if(cb) cb(); };

/* ---------- revisión de la salida (muestra los datos y ofrece corregir) ---------- */
function closeReview(){ $('rscrim').classList.remove('on'); $('review').classList.remove('on'); }
$('rscrim').onclick=closeReview;
function showSalidaReview(s){
  const over=isOverCap(s), counted=durH(s);
  $('reviewCard').innerHTML=`
    <div class="rev-badge ${over?'bad':'ok'}">${over?'⚠︎':'✓'}</div>
    <h3>${over?'Revisá este fichaje':'¿Está correcto?'}</h3>
    <p>Fichaste la salida. Confirmá que los datos estén bien.</p>
    <div class="rev-grid">
      <div class="rev-row"><span><i class="dot" style="background:var(--live)"></i>Entrada</span><b style="text-transform:capitalize">${fmtDateLong(sDate(s))} · ${sTime(s)}</b></div>
      <div class="rev-row"><span><i class="dot" style="background:var(--accent)"></i>Salida</span><b style="text-transform:capitalize">${fmtDateLong(eDate(s))} · ${eTime(s)}</b></div>${dayDiff(s)>0?`<div class="rev-row"><span>Cruce de día</span><b style="color:var(--gold)">+${dayDiff(s)} día(s)</b></div>`:''}
      <div class="rev-row total ${over?'bad':''}"><span>Total</span><b>${fmtHM(counted)} h</b></div>
    </div>
    ${over?`<div class="warnbar bad">⚠️ Supera el máximo de ${maxHours()} h. Se contabiliza recortado a ${fmtHM(counted)} y queda marcado en rojo. Si te olvidaste de fichar la salida, tocá “Corregir”.</div>`:''}
    <div class="confirm-actions">
      <button class="btn ghost" id="revEdit">Corregir</button>
      <button class="btn ${over?'danger':'accent'}" id="revOk">Sí, está bien</button>
    </div>`;
  $('rscrim').classList.add('on'); $('review').classList.add('on');
  $('revOk').onclick=closeReview;
  $('revEdit').onclick=()=>{ closeReview(); editSession(s.id); };
}

/* ---------- configurar tope de horas por fichaje ---------- */
function editMax(){
  openSheet(`
    <h2>Máximo por fichaje</h2>
    <div class="note">Si un fichaje supera este límite (por ejemplo, si te olvidás de marcar la salida), no se contabiliza de más: se recorta a este valor, se marca en rojo y te avisa.</div>
    <label class="f">Horas máximas</label>
    <input class="field" type="number" inputmode="decimal" id="mx_val" value="${maxHours()}" placeholder="16">
    <div class="actions"><button class="btn ghost" onclick="closeSheet()">Cancelar</button><button class="btn accent" id="mx_save">Guardar</button></div>
  `);
  $('mx_save').onclick=()=>{const v=+$('mx_val').value; if(!v||v<=0){toast('Poné un número válido');return;} S.settings.maxHours=v; save(); closeSheet(); toast('Tope actualizado a '+v+' h'); render();};
}

function editSession(id){
  const s = id? S.sessions.find(x=>x.id===id) : {id:null,start:nowISO(),end:'',note:''};
  const isNew=!id;
  openSheet(`
    <h2>${isNew?'Cargar fichaje':'Editar fichaje'}</h2>
    <div class="note">Cada horario lleva su fecha. Si el turno cruza la medianoche (ej: entrás sábado y salís domingo), poné la fecha real de la salida.</div>
    <label class="f">Entrada — fecha y hora</label>
    <input class="field" type="datetime-local" id="f_start" value="${s.start||''}">
    <label class="f">Salida — fecha y hora</label>
    <input class="field" type="datetime-local" id="f_end" value="${s.end||''}">
    <label class="f">Descripción (opcional)</label>
    <textarea class="field" id="f_note" placeholder="Obra, tarea, comentario…">${s.note?escapeHTML(s.note):''}</textarea>
    <div class="actions">
      <button class="btn ghost" onclick="closeSheet()">Cancelar</button>
      <button class="btn accent" id="f_save">Guardar</button>
    </div>
    ${!isNew?`<button class="link-danger" id="f_del">Eliminar fichaje</button>`:''}
  `);
  $('f_save').onclick=()=>{
    const start=$('f_start').value, end=$('f_end').value||null, note=$('f_note').value.trim();
    if(!start){toast('Poné la fecha y hora de entrada');return;}
    if(end && new Date(end)<=new Date(start)){toast('La salida debe ser posterior a la entrada');return;}
    let sess;
    if(isNew){sess={id:uid(),start,end,note};S.sessions.push(sess);}
    else{Object.assign(s,{start,end,note}); delete s.date; sess=s;}
    save();closeSheet();render();
    if(end&&isOverCap(sess)) toast('⚠️ Supera el tope de '+maxHours()+' h — se recortó a '+fmtHM(durH(sess)));
    else toast('Guardado');
  };
  if($('f_del')) $('f_del').onclick=()=>askConfirm({title:'Eliminar fichaje',msg:'Se va a borrar este fichaje. Esta acción no se puede deshacer.',okText:'Eliminar'},()=>{S.sessions=S.sessions.filter(x=>x.id!==id);save();closeSheet();toast('Fichaje eliminado');render();});
}

function editRate(mk){
  const isMonth=!!mk;
  const cur = isMonth ? (S.monthlyPlans[mk]&&S.monthlyPlans[mk].rate!=null?S.monthlyPlans[mk].rate:'') : (S.settings.rate||'');
  openSheet(`
    <h2>${isMonth?'Tarifa de '+labelMonth(mk):'Valor de la hora'}</h2>
    <label class="f">Precio por hora (${S.settings.currency})</label>
    <input class="field" type="number" inputmode="decimal" id="r_val" value="${cur}" placeholder="0">
    ${isMonth?'<div class="note" style="margin-top:8px">Si lo dejás vacío, usa la tarifa general.</div>':''}
    <label class="f">Moneda</label>
    <select class="field" id="r_cur">
      ${['ARS','USD','EUR'].map(c=>`<option ${c===S.settings.currency?'selected':''}>${c}</option>`).join('')}
    </select>
    <div class="actions"><button class="btn ghost" onclick="closeSheet()">Cancelar</button><button class="btn accent" id="r_save">Guardar</button></div>
  `);
  $('r_save').onclick=()=>{
    S.settings.currency=$('r_cur').value;
    const v=$('r_val').value;
    if(isMonth){ S.monthlyPlans[mk]=S.monthlyPlans[mk]||{}; if(v==='') delete S.monthlyPlans[mk].rate; else S.monthlyPlans[mk].rate=+v; }
    else { S.settings.rate=+v||0; }
    save();closeSheet();toast('Tarifa actualizada');render();
  };
}

function editPlan(){
  const mk=dashMonth; const p=S.monthlyPlans[mk]||{};
  openSheet(`
    <h2>Horario definido · ${labelMonth(mk)}</h2>
    <div class="note">Cargá las horas que te definen para el mes. Sirve para comparar contra lo que realmente trabajás y calcular cuánto deberían pagarte.</div>
    <label class="f">Horas previstas del mes</label>
    <input class="field" type="number" inputmode="decimal" id="p_h" value="${p.scheduledHours||''}" placeholder="ej: 160">
    <div class="actions"><button class="btn ghost" onclick="closeSheet()">Cancelar</button><button class="btn accent" id="p_save">Guardar</button></div>
  `);
  $('p_save').onclick=()=>{S.monthlyPlans[mk]=Object.assign(S.monthlyPlans[mk]||{},{scheduledHours:+$('p_h').value||0});save();closeSheet();toast('Horario guardado');render();};
}

function editPayment(id){
  const p = id? S.payments.find(x=>x.id===id) : {id:null,date:todayISO(),amount:'',forMonth:pagosMonth,note:''};
  const isNew=!id;
  openSheet(`
    <h2>${isNew?'Registrar pago':'Editar pago'}</h2>
    <label class="f">Fecha del pago</label>
    <input class="field" type="date" id="p_date" value="${p.date}">
    <label class="f">Monto</label>
    <input class="field" type="number" inputmode="decimal" id="p_amt" value="${p.amount}" placeholder="0">
    <label class="f">Corresponde al mes</label>
    <input class="field" type="month" id="p_for" value="${p.forMonth}">
    <label class="f">Nota (opcional)</label>
    <input class="field" id="p_note" value="${p.note?escapeHTML(p.note):''}" placeholder="quincena, adelanto…">
    <div class="actions"><button class="btn ghost" onclick="closeSheet()">Cancelar</button><button class="btn accent" id="p_save">Guardar</button></div>
    ${!isNew?`<button class="link-danger" id="p_del">Eliminar pago</button>`:''}
  `);
  $('p_save').onclick=()=>{
    const date=$('p_date').value, amount=+$('p_amt').value||0, forMonth=$('p_for').value, note=$('p_note').value.trim();
    if(!amount){toast('Poné el monto');return;}
    if(isNew) S.payments.push({id:uid(),date,amount,forMonth,note});
    else Object.assign(p,{date,amount,forMonth,note});
    save();closeSheet();toast('Pago guardado');render();
  };
  if($('p_del'))$('p_del').onclick=()=>askConfirm({title:'Eliminar pago',msg:'Se va a borrar este pago registrado. Esta acción no se puede deshacer.',okText:'Eliminar'},()=>{S.payments=S.payments.filter(x=>x.id!==id);save();closeSheet();toast('Pago eliminado');render();});
}

/* =========================================================================
   EXPORTAR / RESPALDO
   ========================================================================= */
function download(name, blob){
  const url=URL.createObjectURL(blob); const a=document.createElement('a');
  a.href=url; a.download=name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 4000);
}
function sessionsForExport(){
  return [...S.sessions].filter(s=>s.start).sort((a,b)=>a.start.localeCompare(b.start))
    .map(s=>({fEnt:sDate(s),hEnt:sTime(s),fSal:eDate(s)||'',hSal:eTime(s)||'',horas:s.end?durH(s):0,nota:s.note||'',cerrado:!!s.end}));
}
function exportCSV(){
  const rows=sessionsForExport();
  const head=['Fecha entrada','Hora entrada','Fecha salida','Hora salida','Horas (hh:mm)','Horas (dec)','Nota'];
  const body=rows.map(r=>[r.fEnt,r.hEnt,r.fSal,r.hSal,r.cerrado?fmtHM(r.horas):'',
    r.cerrado?fmtDec(r.horas).replace('.',','):'', (r.nota||'').replace(/;/g,',')]);
  // separador ';' + decimal ',' = Excel es-AR abre en columnas directo
  const csv=[head,...body].map(l=>l.join(';')).join('\r\n');
  download(`fichajes_${todayISO()}.csv`, new Blob(['\uFEFF'+csv],{type:'text/csv;charset=utf-8'}));
  toast('CSV exportado');
}
async function exportXLSX(){
  try{
    if(!window.XLSX){ await loadScript('https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js'); }
    const XLSX=window.XLSX;
    const rows=sessionsForExport().map(r=>({'Fecha entrada':r.fEnt,'Hora entrada':r.hEnt,'Fecha salida':r.fSal,'Hora salida':r.hSal,
      'Horas (hh:mm)':r.cerrado?fmtHM(r.horas):'','Horas (dec)':r.cerrado?+r.horas.toFixed(2):'',Nota:r.nota}));
    // resumen mensual (imputado al mes de la ENTRADA)
    const mm={};
    S.sessions.forEach(s=>{const mk=monthKey(sDate(s));mm[mk]=(mm[mk]||0)+(s.end?durH(s):0);});
    const resumen=Object.keys(mm).sort().map(mk=>{
      const r=rateFor(mk), cob=S.payments.filter(p=>p.forMonth===mk).reduce((a,p)=>a+(+p.amount||0),0);
      const plan=S.monthlyPlans[mk]||{};
      return {Mes:mk,'Horas trabajadas':+mm[mk].toFixed(2),'Horas previstas':+plan.scheduledHours||'',
        'Tarifa':r||'','Ganado':+(mm[mk]*r).toFixed(2),'Cobrado':cob,'Estado':S.monthStatus[mk]||'pendiente'};
    });
    const wb=XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(rows), 'Fichajes');
    XLSX.utils.book_append_sheet(wb, XLSX.utils.json_to_sheet(resumen), 'Resumen mensual');
    XLSX.writeFile(wb, `fichajes_${todayISO()}.xlsx`);
    toast('XLSX exportado');
  }catch(e){ toast('Sin internet para XLSX — usá CSV'); }
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s);});}

function backup(){
  download(`respaldo_fichaje_${todayISO()}.json`, new Blob([JSON.stringify(S)],{type:'application/json'}));
  S.settings.lastBackup=new Date().toISOString(); save(); toast('Respaldo descargado ✓'); if(TAB==='ajustes') render();
}
function restore(e){
  const f=e.target.files[0]; if(!f) return;
  const rd=new FileReader();
  rd.onload=()=>{ try{
      const data=JSON.parse(rd.result);
      if(!data||!Array.isArray(data.sessions)) throw 0;
      askConfirm({title:'Restaurar respaldo',msg:'Esto reemplaza TODOS los datos actuales por los del archivo. Esta acción no se puede deshacer.',okText:'Restaurar'},()=>{
        S=Object.assign({},structuredClone(DEFAULT),data); S.settings=Object.assign({},DEFAULT.settings,data.settings||{});
        migrate(S); save(); toast('Datos restaurados'); render();
      });
    }catch(_){ toast('Archivo inválido'); } };
  rd.readAsText(f); e.target.value='';
}

async function showStorage(){
  const el=$('storageNote'); if(!el) return;
  let persist=false, usage='';
  try{ if(navigator.storage&&navigator.storage.persisted) persist=await navigator.storage.persisted(); }catch(_){}
  try{ if(navigator.storage&&navigator.storage.estimate){const es=await navigator.storage.estimate(); usage=` · usado ${(es.usage/1024).toFixed(0)} KB`;} }catch(_){}
  el.innerHTML = `Almacenamiento persistente: <b style="color:${persist?'var(--live)':'var(--accent)'}">${persist?'activo':'no garantizado'}</b>${usage}. `
    + (persist?'iOS no debería borrar tus datos por espacio.':'Instalá a inicio y hacé respaldos periódicos por las dudas.');
}

/* ---------- util ---------- */
function fmtDate(iso){const d=new Date(iso+'T00:00:00');return `${pad(d.getDate())}/${pad(d.getMonth()+1)}`;}
function escapeHTML(s){return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
let toastT=null;
function toast(m){const t=$('toast');t.textContent=m;t.classList.add('on');clearTimeout(toastT);toastT=setTimeout(()=>t.classList.remove('on'),1900);}

/* ---------- tabs ---------- */
document.querySelectorAll('#tabs button').forEach(b=>b.onclick=()=>{TAB=b.dataset.tab;render();});

/* ---------- reloj + timer vivo ---------- */
setInterval(()=>{
  const wc=$('wallClock'); if(wc && TAB==='fichar') wc.textContent=nowHM();
  const lt=$('liveTimer'); const op=S&&openSession();
  if(lt&&op) lt.textContent=fmtHM(durH(op));
},1000);

/* ---------- boot ---------- */
(async function init(){
  try{ S = await dbGet() || structuredClone(DEFAULT); }
  catch(_){ S = structuredClone(DEFAULT); }
  S=Object.assign({},structuredClone(DEFAULT),S); S.settings=Object.assign({},DEFAULT.settings,S.settings||{});
  migrate(S);            // normaliza fichajes viejos (fecha única) al modelo fecha+hora
  save();                // persiste el modelo migrado
  render();
  try{ if(navigator.storage&&navigator.storage.persist) await navigator.storage.persist(); }catch(_){}
  if('serviceWorker' in navigator){ try{ await navigator.serviceWorker.register('sw.js'); }catch(_){} }
})();
</script>
